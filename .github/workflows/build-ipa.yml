name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      signed:
        description: "是否签名导出 IPA（false = 仅编译未签名 .app）"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      export_method:
        description: "签名方式（ad-hoc 需付费开发者账号，development 支持免费账号但仅 7 天）"
        required: true
        default: "ad-hoc"
        type: choice
        options:
          - "ad-hoc"
          - "development"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ipa.yml"

env:
  PROJECT: MagnetPlayer.xcodeproj
  SCHEME: MagnetPlayer

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 判断签名模式
        id: signing
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.signed }}"
          if [ "$INPUT" = "false" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: 导入签名证书
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: 导入描述文件
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: 编译并签名（Archive）
        if: steps.signing.outputs.mode == 'signed'
        working-directory: ios
        shell: bash
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          SIGN_IDENTITY=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          echo "使用签名身份: $SIGN_IDENTITY"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/MagnetPlayer.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY"

      - name: 导出 IPA
        if: steps.signing.outputs.mode == 'signed'
        shell: bash
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          METHOD="${{ github.event.inputs.export_method }}"
          [ -z "$METHOD" ] && METHOD="ad-hoc"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MagnetPlayer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: 编译未签名 .app
        if: steps.signing.outputs.mode == 'unsigned'
        working-directory: ios
        shell: bash
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath "$RUNNER_TEMP/derived"

      - name: 上传 IPA（已签名）
        if: steps.signing.outputs.mode == 'signed'
        uses: actions/upload-artifact@v4
        with:
          name: MagnetPlayer-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: 上传 .app（未签名）
        if: steps.signing.outputs.mode == 'unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: MagnetPlayer-unsigned-app
          path: ${{ runner.temp }}/derived/Build/Products/Release-iphoneos/MagnetPlayer.app
          if-no-files-found: error
